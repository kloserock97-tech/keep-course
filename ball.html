<style>
/* Шрифт макета подключён по ссылке владельца, файлов в проекте нет. Если не загрузился — Manrope. */
@font-face { font-family: "SB Sans Display"; font-weight: 400; font-display: swap; src: url(https://cdn-app.sberdevices.ru/shared-static/0.0.0/fonts/SBSansDisplay.0.2.0/SBSansDisplay-Regular.woff2) format("woff2"); }
@font-face { font-family: "SB Sans Display"; font-weight: 600; font-display: swap; src: url(https://cdn-app.sberdevices.ru/shared-static/0.0.0/fonts/SBSansDisplay.0.2.0/SBSansDisplay-Semibold.woff2) format("woff2"); }
/* Manrope лежит рядом. Глифы приподняты на 0,06 em: так строки встают на те же места, что в макете */
@font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(assets/fonts/manrope-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; ascent-override: 100.6%; descent-override: 36%; line-gap-override: 0%; }
@font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(assets/fonts/manrope-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2212; ascent-override: 100.6%; descent-override: 36%; line-gap-override: 0%; }
:root {
  --blue: #2b6cfc;
  --ink: #020202;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --page: #e9edf3;
  --font: "SB Sans Display", Manrope, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--page);
  font-family: var(--font); font-weight: 400;
  color: var(--ink);
  display: grid;
  place-items: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- iPhone 15 ---------- */
.fit { width: calc(417px * var(--s, 1)); height: calc((var(--sh, 852px) + 24px) * var(--s, 1)); }
.device {
  width: 417px; height: calc(var(--sh, 852px) + 24px); padding: 12px;
  border-radius: 67px;
  background: #101114;
  box-shadow: 0 0 0 2px #c9ccd3, 0 0 0 3px #8e9199, 0 40px 80px -30px rgba(20, 30, 60, .35);
  transform: scale(var(--s, 1)); transform-origin: 0 0;
}
.screen {
  position: relative; width: 393px; height: var(--sh, 852px);
  border-radius: 55px; overflow: hidden; background: #fff;
  isolation: isolate;
}
.island {
  position: absolute; z-index: 40; top: 11px; left: 50%; margin-left: -63px;
  width: 126px; height: 37px; border-radius: 20px; background: #000;
}
body.bare .fit { width: calc(393px * var(--s, 1)); height: calc(var(--sh, 852px) * var(--s, 1)); }
body.bare .device { width: 393px; height: var(--sh, 852px); padding: 0; border-radius: 0; box-shadow: none; background: none; }
body.bare .screen { border-radius: 0; }
body.bare .island, body.bare:not(.bare-auto) .replay { display: none; }
body.bare-auto .replay { top: 12px; right: auto; bottom: auto; left: 50%; transform: translateX(-50%); z-index: 50; padding: 6px 12px; font-size: 12px; opacity: .7; }
body.bare { background: #fff; }

/* ---------- Статус-бар и шапка ---------- */
.header {
  position: absolute; z-index: 4; inset: 0 0 auto 0; height: 104px;
  background: linear-gradient(#fff 80%, rgba(255, 255, 255, 0));
}
.time {
  position: absolute; left: 0; top: 18.34px; width: 140.5px; text-align: center;
  font: 590 17px/22px -apple-system, "SF Pro Text", "SF Pro", Inter, "Segoe UI", sans-serif;
  color: #222; letter-spacing: 0;
}
.levels { position: absolute; right: 0; top: 0; width: 140.5px; height: 54px; }
.levels > * { position: absolute; display: block; }
.cellular { left: 30px; top: 23.54px; }
.wifi { left: 56.7px; top: 23.64px; }
.batt { left: 81px; top: 23px; width: 25px; height: 13px; border-radius: 4.3px; background: rgba(34, 34, 34, .35); }
.batt::after { content: ""; position: absolute; inset: 2px; border-radius: 2.5px; background: #222; }
.cap { left: 107px; top: 27.78px; }

/* ---------- Иллюстрация ---------- */
.art { position: absolute; z-index: 1; left: 2px; top: 111.4px; width: 390px; height: 380.75px; }
.l { position: absolute; }
.l img { display: block; width: 100%; height: 100%; }

/* появление фона: облака, точки и пустые кружки мягко проявляются волной */
.in { opacity: 0; transform: scale(.94); transition: opacity 420ms var(--ease-out) var(--d, 0ms), transform 520ms var(--ease-out) var(--d, 0ms); }
.art:not([data-state="pre"]) .in { opacity: 1; transform: none; }

/* фоновый цикл: облака плывут, точки покачиваются */
@keyframes drift { from { transform: translateX(calc(var(--a, 6px) * -1)); } to { transform: translateX(var(--a, 6px)); } }
@keyframes bob { from { transform: translateY(-2.5px); } to { transform: translateY(2.5px); } }
.cloud img { animation: drift var(--t, 11s) ease-in-out var(--o, 0s) infinite alternate; }
.dot img { animation: bob var(--t, 4.6s) ease-in-out var(--o, 0s) infinite alternate; }

.token::before { /* белая подложка: галочка в картинке прозрачная */
  content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #fff;
}
.token img { position: relative; }

/* дорожка недели: пять кружков, поднята и укрупнена — руки в этой версии нет */
.track { position: absolute; inset: 0; transform: translate(-6px, -30px) scale(1.06); transform-origin: 201px 246px; }
.ghost { opacity: 0; }                                   /* пустые кружки первых трёх дней: видны только до штампа */
.ring-4 img { transition: opacity 420ms ease; }

/* несохранённые дни слегка плавают, сохранённые стоят твёрдо */
@keyframes hover { from { transform: translateY(-2px); } to { transform: translateY(2px); } }
.ring-4 img, .glow4 i { animation: hover 3.6s ease-in-out infinite alternate; }
.ring-5 img { animation: hover 4.4s ease-in-out -1.2s infinite alternate; }

/* свечение «сегодня» вокруг пустого кружка; раз в шесть секунд зовёт, кнопка отвечает */
.glow4 { left: 206.3px; top: 174px; width: 124px; height: 124px; transition: opacity 240ms ease, transform 320ms var(--ease-out); }
.glow4 i { display: block; width: 100%; height: 100%; }
.glow4 b {
  display: block; width: 100%; height: 100%; border-radius: 50%;
  background: radial-gradient(closest-side, rgba(56, 220, 160, .16) 0%, rgba(56, 220, 160, .2) 34%, rgba(56, 220, 160, .52) 50%, rgba(56, 220, 160, .24) 68%, rgba(56, 220, 160, 0) 100%);
}
@keyframes call { 0%, 68%, 100% { opacity: .62; transform: scale(.95); } 34% { opacity: .9; transform: scale(1.02); } 80% { opacity: 1; transform: scale(1.16); } }
.art[data-state="idle"] .glow4 b { animation: call 6s ease-in-out infinite; }
.art[data-state="placed"] .glow4 { opacity: 0; transform: scale(1.3); }
@keyframes knock { 0%, 84%, 100% { transform: none; } 89% { transform: scale(1.012, .93); } 94% { transform: scale(.996, 1.035); } }
.btn-wrap { transform-origin: 50% 100%; }
.art[data-state="idle"] ~ .sheet .btn-wrap { animation: knock 6s ease-in-out infinite; }

/* мяч-галочка: проходит по дням, падает вниз и становится кнопкой */
.ball { position: absolute; z-index: 6; left: 0; top: 0; width: 73px; height: 74px; margin: -37px 0 0 -36.5px; opacity: 0; pointer-events: none; }
.ball-y, .ball-s { width: 100%; height: 100%; }
.ball-s { position: relative; }
.ball-s::before { content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #fff; }
.ball-s img { position: relative; display: block; width: 100%; height: 100%; }
.spark { width: 26px; height: 26px; margin: -13px 0 0 -13px; opacity: 0; pointer-events: none; }
.spark svg { display: block; }

/* четвёртая галочка встаёт на место с лёгкой посадкой */
@keyframes land { 0% { opacity: 0; transform: scale(.9); } 55% { opacity: 1; transform: scale(1.07); } 100% { opacity: 1; transform: none; } }
.token-4 { left: 231.69px; top: 199.2px; width: 73px; height: 74px; opacity: 0; transition: opacity 240ms ease; }
.art[data-state="placed"] .token-4 { animation: land 380ms var(--ease-out) both; }
/* соседние галочки отзываются волной от новой */
@keyframes echo { 50% { transform: scale(1.06); } }
.art[data-state="placed"] .token[style*="--w"] { animation: echo 420ms ease-in-out calc(140ms + var(--w) * 70ms); }

@keyframes ripple { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(1.85); } }
.ripple { left: 239.3px; top: 206.95px; width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--blue); opacity: 0; pointer-events: none; }
.art[data-state="placed"] .ripple { animation: ripple 680ms var(--ease-out) 40ms both; }
@keyframes flash { 0% { opacity: 0; transform: scale(.3) rotate(-30deg); } 40% { opacity: 1; transform: scale(1.5) rotate(10deg); } 100% { opacity: 0; transform: scale(.8) rotate(45deg); } }
.art[data-state="placed"] .spark-4 { animation: flash 520ms var(--ease-out) 60ms both; }

@keyframes nudge { 50% { transform: scale(1.08); } }
.art[data-state="placed"] .ring-5 { animation: nudge 520ms ease-in-out 380ms; }
@keyframes twinkle { 45% { transform: scale(1.45); } }
.art[data-state="placed"] .dot { animation: twinkle 460ms ease-in-out calc(180ms + var(--i) * 55ms); }

/* ---------- Свечение под текстом, текст, кнопки ---------- */
.aura { position: absolute; z-index: 2; left: 17px; bottom: -128px; width: 615px; height: 600px; pointer-events: none; }
.sheet {
  position: absolute; z-index: 5; inset: auto 0 0 0;
  padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 16px;
}
.copy { display: flex; flex-direction: column; gap: 8px; }
h1 { font-size: 24px; font-weight: 600; line-height: 29px; white-space: nowrap; }
html:not(.sb) h1 { letter-spacing: -.003em; }
html.sb h1 { position: relative; top: -1px; }   /* то же округление метрик, что в статистике */
.copy p { font-size: 16px; line-height: 22px; }
html:not(.sb) .copy p { letter-spacing: .006em; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.btn {
  appearance: none; border: 0; width: 100%; padding: 12px 24px; border-radius: 16px;
  font: 600 16px/24px var(--font); cursor: pointer;
  background: none; color: var(--blue);
  transition: transform 140ms var(--ease-out), background-color 200ms ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn-primary { background: var(--blue); color: #fff; display: grid; }
.btn-primary > span { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 180ms ease, transform 220ms var(--ease-out); }
.btn-primary .done { opacity: 0; transform: translateY(6px); }
.btn-primary.is-done .ask { opacity: 0; transform: translateY(-6px); }
.btn-primary.is-done .done { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) { .btn-primary:hover { background: #2460e6; } }
.home { position: absolute; z-index: 1; left: 50%; bottom: 8px; margin-left: -72px; width: 144px; height: 5px; border-radius: 3px; background: #000; }

.replay {
  position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 999px; border: 0;
  font: 600 14px/20px var(--font); color: #3b4354; background: #fff; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 30, 60, .12);
}

.no-anim, .no-anim * { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  .cloud img, .dot img, .ring-4 img, .ring-5 img, .glow4 i, .glow4 b, .btn-wrap { animation: none !important; }
  .in, .token-4 { transform: none !important; }
  .art[data-state="placed"] .ripple, .art[data-state="placed"] .ring-5, .art[data-state="placed"] .dot, .art[data-state="placed"] .spark-4 { animation: none; }
}

<script>
(() => {
  const art = document.querySelector('.art');
  const connect = document.getElementById('connect');
  const params = new URLSearchParams(location.search);
  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const set = (s) => { art.dataset.state = s; };

  // подгонка телефона под окно; на самом телефоне — без рамки
  const fit = () => {
    const bare = params.has('bare') || Math.min(innerWidth, innerHeight) < 500;
    document.body.classList.toggle('bare', bare);
    document.body.classList.toggle('bare-auto', bare && !params.has('bare'));
    const sh = +params.get('h') || 852;                 // ?h=844 — высота макета, для сверки
    document.documentElement.style.setProperty('--sh', sh + 'px');
    const w = bare ? 393 : 417, h = bare ? sh : sh + 24, pad = bare ? 0 : 32;
    const s = Math.min((innerWidth - pad) / w, (innerHeight - pad) / h, bare ? 9 : 1.15);
    document.documentElement.style.setProperty('--s', s.toFixed(4));
  };
  addEventListener('resize', fit); fit();

  const screen = document.querySelector('.screen');
  const view = (v) => { screen.dataset.view = v; };

  const intro = document.querySelector('.intro');
  const ball = intro.querySelector('.ball'), ballY = ball.firstElementChild, ballS = ballY.firstElementChild;
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let anims = [];
  const play = (el, frames, opts) => { const a = el.animate(frames, { fill: 'backwards', ...opts }); anims.push(a); return a; };
  const stop = () => { anims.forEach((a) => a.cancel()); anims = []; };
  // центр элемента в координатах экрана телефона
  const at = (el) => {
    const s = +getComputedStyle(document.documentElement).getPropertyValue('--s') || 1;
    const r = el.getBoundingClientRect(), o = intro.getBoundingClientRect();
    return { x: (r.left + r.width / 2 - o.left) / s, y: (r.top + r.height / 2 - o.top) / s };
  };
  const tx = (v) => `translateX(${v.toFixed(1)}px)`, ty = (v) => `translateY(${v.toFixed(1)}px)`;
  const UP = 'cubic-bezier(.2, .7, .4, 1)', DOWN = 'cubic-bezier(.55, 0, .9, .5)', OUT = 'cubic-bezier(.23, 1, .32, 1)';

  // Появление. Мяч-галочка проходит по трём дням и ставит на каждом штамп,
  // проваливается сквозь пустой четвёртый, падает вниз и становится кнопкой. Из кнопки выходит текст.
  const enter = () => {
    clear(); stop();
    connect.classList.remove('is-done');
    view('intro'); window.Stats.reset();
    art.classList.add('no-anim'); set('pre');
    void art.offsetWidth;
    art.classList.remove('no-anim');
    if (calm) { set('idle'); return; }
    set('enter');

    const tokens = [...art.querySelectorAll('.token:not(.token-4)')], ghosts = [...art.querySelectorAll('.ghost')];
    const P = tokens.map(at), R4 = at(art.querySelector('.ring-4')), B = at(connect);
    const T0 = 120, L = [T0 + 240, T0 + 430, T0 + 620], PASS = T0 + 810, HIT = PASS + 300, D = HIT - T0;
    const k = (t) => (t - T0) / D;
    const start = { x: P[0].x - 52, y: P[0].y - 190 };

    play(ball, [{ opacity: 0 }, { opacity: 1, offset: 0.04 }, { opacity: 1, offset: 0.995 }, { opacity: 0 }], { delay: T0, duration: D });
    play(ball, [
      { transform: tx(start.x) }, { transform: tx(P[0].x), offset: k(L[0]) }, { transform: tx(P[1].x), offset: k(L[1]) },
      { transform: tx(P[2].x), offset: k(L[2]) }, { transform: tx(R4.x), offset: k(PASS) }, { transform: tx(B.x) },
    ], { delay: T0, duration: D, composite: 'add' });
    const hop = (a, b, t0, t1, h) => [
      { transform: ty(a.y), offset: k(t0), easing: UP },
      { transform: ty(Math.min(a.y, b.y) - h), offset: k(t0 + (t1 - t0) * 0.45), easing: DOWN },
      { transform: ty(b.y), offset: k(t1) },
    ];
    play(ballY, [
      { transform: ty(start.y), easing: DOWN }, { transform: ty(P[0].y), offset: k(L[0]) },
      ...hop(P[0], P[1], L[0], L[1], 26).slice(1), ...hop(P[1], P[2], L[1], L[2], 26).slice(1),
      ...hop(P[2], R4, L[2], PASS, 38).slice(1, 2), { transform: ty(R4.y), offset: k(PASS), easing: 'cubic-bezier(.4, .2, .8, .7)' },
      { transform: ty(B.y) },
    ], { delay: T0, duration: D });
    const squash = (t) => [{ transform: 'scale(1)', offset: k(t - 45) }, { transform: 'scale(1.16, .82)', offset: k(t) }, { transform: 'scale(.96, 1.05)', offset: k(t + 70) }, { transform: 'scale(1)', offset: k(t + 130) }];
    play(ballS, [
      { transform: 'scale(1) rotate(-50deg)' }, ...squash(L[0]), ...squash(L[1]), ...squash(L[2]),
      { transform: 'scale(1)', offset: k(PASS) }, { transform: 'scale(.72) rotate(360deg)' },
    ], { delay: T0, duration: D });

    // штампы: пустой кружок сменяется галочкой, рядом вспыхивает искра
    tokens.forEach((t, i) => {
      play(t, [{ opacity: 0, transform: 'scale(.86)' }, { opacity: 1, transform: 'scale(1.08)', offset: 0.5 }, { opacity: 1, transform: 'none' }], { delay: L[i], duration: 320, easing: OUT });
      play(ghosts[i], [{ opacity: 0 }, { opacity: 1, offset: 200 / (L[i] + 120) }, { opacity: 1, offset: L[i] / (L[i] + 120) }, { opacity: 0 }], { duration: L[i] + 120, fill: 'none' });
      play(art.querySelector('.spark-' + (i + 1)), [{ opacity: 0, transform: 'scale(.3) rotate(-30deg)' }, { opacity: 1, transform: 'scale(1.1) rotate(10deg)', offset: 0.4 }, { opacity: 0, transform: 'scale(.6) rotate(45deg)' }], { delay: L[i] + 20, duration: 340, fill: 'both' });
    });
    // пустой четвёртый не держит: мяч проходит насквозь, кружок вздрагивает и загорается «сегодня»
    play(art.querySelector('.ring-4'), [{ transform: 'none' }, { transform: 'scale(1.16)' }, { transform: 'scale(.97)' }, { transform: 'none' }], { delay: PASS - 30, duration: 380, fill: 'none', easing: 'ease-out' });
    play(art.querySelector('.glow4'), [{ opacity: 0, transform: 'scale(.7)' }, { opacity: 1, transform: 'none' }], { delay: PASS, duration: 420, easing: OUT });

    // мяч стал кнопкой: круг раскрывается в плашку, из неё выходят текст и вторая кнопка
    play(connect, [{ opacity: 0 }, { opacity: 0, offset: 0.999 }, { opacity: 1 }], { duration: HIT, fill: 'none' });
    play(connect, [{ clipPath: 'inset(0 calc(50% - 24px) round 24px)' }, { clipPath: 'inset(0 0% round 16px)' }], { delay: HIT, duration: 340, easing: OUT });
    play(connect.parentElement, [{ transform: 'scale(1.06, .78)' }, { transform: 'scale(.99, 1.07)', offset: 0.45 }, { transform: 'none' }], { delay: HIT, duration: 380, fill: 'none', easing: 'ease-out' });
    play(connect.querySelector('.ask'), [{ opacity: 0 }, { opacity: 1 }], { delay: HIT + 150, duration: 200 });
    const rise = (el, from, delay) => play(el, [{ opacity: 0, transform: `translateY(${from}px) scale(.98)` }, { opacity: 1, transform: 'none' }], { delay: HIT + delay, duration: 440, easing: OUT });
    rise(intro.querySelector('.copy p'), 22, 70);
    rise(intro.querySelector('h1'), 34, 130);
    rise(document.getElementById('later'), -14, 200);

    later(() => set('idle'), HIT + 220);
  };

  // «Подключить»: кнопка отдаёт мяч, он взлетает и встаёт в четвёртый кружок — курс сохранён
  const place = () => {
    if (art.dataset.state !== 'idle') return;
    clear();
    connect.classList.add('is-done');
    set('placing');
    const fly = calm ? 0 : 400;
    if (!calm) {
      const B = at(connect), R4 = at(art.querySelector('.ring-4'));
      play(connect.parentElement, [{ transform: 'none' }, { transform: 'scale(1.03, .84)', offset: 0.3 }, { transform: 'scale(.99, 1.05)', offset: 0.65 }, { transform: 'none' }], { duration: 340, fill: 'none', easing: 'ease-out' });
      play(ball, [{ opacity: 1 }, { opacity: 1, offset: 0.97 }, { opacity: 0 }], { duration: fly + 30, fill: 'none' });
      play(ball, [{ transform: tx(B.x) }, { transform: tx(R4.x) }], { duration: fly, fill: 'both', composite: 'add', easing: 'cubic-bezier(.3, .6, .5, 1)' });
      play(ballY, [{ transform: ty(B.y), easing: OUT }, { transform: ty(R4.y - 16), offset: 0.74, easing: 'ease-in' }, { transform: ty(R4.y) }], { duration: fly, fill: 'both' });
      play(ballS, [{ transform: 'scale(.72) rotate(-200deg)' }, { transform: 'scale(1.06) rotate(0deg)', offset: 0.8 }, { transform: 'scale(1)' }], { duration: fly, fill: 'both' });
    }
    later(() => set('placed'), fly - 10);
    if (!params.has('stay')) later(() => view('stats'), fly + 780);
  };

  connect.addEventListener('click', place);
  // «Позже»: экран закрывается без галочки
  document.getElementById('later').addEventListener('click', () => { if (art.dataset.state !== 'idle' || params.has('stay')) return; clear(); later(() => view('stats'), 160); });
  document.getElementById('replay').addEventListener('click', enter);

  const imgs = [...document.querySelectorAll('.art img, .ball img')].map((i) => i.decode ? i.decode().catch(() => {}) : 0);
  Promise.all(imgs).then(() => { if (params.get('screen') === 'stats') { art.classList.add('no-anim'); set('idle'); view('stats'); } else if (!params.has('hold')) enter(); else { art.classList.add('no-anim'); set('idle'); if (params.get('screen') === 'stats') view('stats'); } });
})();
</script>
</body>
</html>
