<style>
/* Шрифт макета подключён по ссылке владельца, файлов в проекте нет. Если не загрузился — Manrope. */
@font-face { font-family: "SB Sans Display"; font-weight: 400; font-display: swap; src: url(https://cdn-app.sberdevices.ru/shared-static/0.0.0/fonts/SBSansDisplay.0.2.0/SBSansDisplay-Regular.woff2) format("woff2"); }
@font-face { font-family: "SB Sans Display"; font-weight: 600; font-display: swap; src: url(https://cdn-app.sberdevices.ru/shared-static/0.0.0/fonts/SBSansDisplay.0.2.0/SBSansDisplay-Semibold.woff2) format("woff2"); }
/* Manrope лежит рядом. Глифы приподняты на 0,06 em: так строки встают на те же места, что в макете */
@font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(assets/fonts/manrope-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; ascent-override: 100.6%; descent-override: 36%; line-gap-override: 0%; }
@font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(assets/fonts/manrope-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2212; ascent-override: 100.6%; descent-override: 36%; line-gap-override: 0%; }
:root {
  --blue: #2b6cfc;
  --ink: #020202;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --page: #e9edf3;
  --font: "SB Sans Display", Manrope, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--page);
  font-family: var(--font); font-weight: 400;
  color: var(--ink);
  display: grid;
  place-items: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- iPhone 15 ---------- */
.fit { width: calc(417px * var(--s, 1)); height: calc((var(--sh, 852px) + 24px) * var(--s, 1)); }
.device {
  width: 417px; height: calc(var(--sh, 852px) + 24px); padding: 12px;
  border-radius: 67px;
  background: #101114;
  box-shadow: 0 0 0 2px #c9ccd3, 0 0 0 3px #8e9199, 0 40px 80px -30px rgba(20, 30, 60, .35);
  transform: scale(var(--s, 1)); transform-origin: 0 0;
}
.screen {
  position: relative; width: 393px; height: var(--sh, 852px);
  border-radius: 55px; overflow: hidden; background: #fff;
  isolation: isolate;
}
.island {
  position: absolute; z-index: 40; top: 11px; left: 50%; margin-left: -63px;
  width: 126px; height: 37px; border-radius: 20px; background: #000;
}
body.bare .fit { width: calc(393px * var(--s, 1)); height: calc(var(--sh, 852px) * var(--s, 1)); }
body.bare .device { width: 393px; height: var(--sh, 852px); padding: 0; border-radius: 0; box-shadow: none; background: none; }
body.bare .screen { border-radius: 0; }
body.bare .island, body.bare:not(.bare-auto) .replay { display: none; }
body.bare-auto .replay { top: 12px; right: auto; bottom: auto; left: 50%; transform: translateX(-50%); z-index: 50; padding: 6px 12px; font-size: 12px; opacity: .7; }
body.bare { background: #fff; }

/* ---------- Статус-бар и шапка ---------- */
.header {
  position: absolute; z-index: 4; inset: 0 0 auto 0; height: 104px;
  background: linear-gradient(#fff 80%, rgba(255, 255, 255, 0));
}
.time {
  position: absolute; left: 0; top: 18.34px; width: 140.5px; text-align: center;
  font: 590 17px/22px -apple-system, "SF Pro Text", "SF Pro", Inter, "Segoe UI", sans-serif;
  color: #222; letter-spacing: 0;
}
.levels { position: absolute; right: 0; top: 0; width: 140.5px; height: 54px; }
.levels > * { position: absolute; display: block; }
.cellular { left: 30px; top: 23.54px; }
.wifi { left: 56.7px; top: 23.64px; }
.batt { left: 81px; top: 23px; width: 25px; height: 13px; border-radius: 4.3px; background: rgba(34, 34, 34, .35); }
.batt::after { content: ""; position: absolute; inset: 2px; border-radius: 2.5px; background: #222; }
.cap { left: 107px; top: 27.78px; }

/* ---------- Иллюстрация ---------- */
.art { position: absolute; z-index: 1; left: 2px; top: 111.4px; width: 390px; height: 380.75px; }
.l { position: absolute; }
.l img { display: block; width: 100%; height: 100%; }

/* появление фона: облака, точки и пустые кружки мягко проявляются волной */
.in { opacity: 0; transform: scale(.94); transition: opacity 420ms var(--ease-out) var(--d, 0ms), transform 520ms var(--ease-out) var(--d, 0ms); }
.art:not([data-state="pre"]) .in { opacity: 1; transform: none; }

/* фоновый цикл: облака плывут, точки покачиваются */
@keyframes drift { from { transform: translateX(calc(var(--a, 6px) * -1)); } to { transform: translateX(var(--a, 6px)); } }
@keyframes bob { from { transform: translateY(-2.5px); } to { transform: translateY(2.5px); } }
.cloud img { animation: drift var(--t, 11s) ease-in-out var(--o, 0s) infinite alternate; }
.dot img { animation: bob var(--t, 4.6s) ease-in-out var(--o, 0s) infinite alternate; }

.token::before { /* белая подложка: галочка в картинке прозрачная */
  content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #fff;
}
.token img { position: relative; }

/* рука с жетоном */
.hand-move {
  position: absolute; inset: 0;
  opacity: 0; transform: translate(-56px, -64px);
  transition: transform 300ms var(--ease-out), opacity 220ms var(--ease-out);
}
.art[data-state="idle"] .hand-move { opacity: 1; transform: none; transition: transform 820ms var(--ease-out) var(--hd, 0ms), opacity 380ms var(--ease-out) var(--hd, 0ms); }
.art:is([data-state="enter"], [data-state="toss"], [data-state="carry"]) .hand-move { opacity: 1; transform: none; transition: none; }   /* здесь рукой управляет сценарий */
/* отклик на нажатие начинается сразу: ease-out, без разгона */
.art[data-state="placing"] .hand-move { opacity: 1; transform: translate(28.57px, 62.20px); transition: transform 300ms var(--ease-out); }
/* дело сделано — рука уходит тем же путём, каким пришла */
.art[data-state="placed"] .hand-move { opacity: 0; transform: translate(-56px, -64px); transition: transform 640ms var(--ease-in-out) 160ms, opacity 260ms ease 420ms; }

/* цикл покоя: покачивание и раз в шесть секунд рука опускает галочку на полпути к пустому кружку */
@keyframes float {
  0%, 100% { transform: translate(0, -2.5px) rotate(-.9deg); }
  40% { transform: translate(0, 2.5px) rotate(.9deg); }
  50%, 53% { transform: translate(11px, 24px) rotate(.2deg); }
  66% { transform: translate(0, 2px) rotate(.7deg); }
}
.hand-float { position: absolute; inset: 0; transform-origin: 80px 40px; }
.art:is([data-state="idle"], [data-state="toss"], [data-state="carry"], [data-state="placing"], [data-state="placed"]) .hand-float { animation: float 6s ease-in-out infinite; }
.art:is([data-state="toss"], [data-state="carry"], [data-state="placing"], [data-state="placed"]) .hand-float { animation-play-state: paused; }
@keyframes wait { 0%, 42%, 62%, 100% { transform: none; } 51% { transform: scale(1.07); } }
.ring-4 { left: 229px; top: 197px; width: 78px; height: 78px; }
.ring-4 img { position: absolute; left: 0; top: 0; transition: opacity 420ms ease; }
.ring-4 .clean { left: 5px; top: 5px; width: 68px; height: 68px; }
.ring-4 .lit { display: none; }
.art[data-state="idle"] .ring-4 img { animation: wait 6s ease-in-out infinite; }

.hand { left: 46px; top: 11px; width: 229px; height: 175px; }
/* мяч в руке: виден, только пока рука несёт его к кружку */
.held { opacity: 0; transition: opacity 110ms ease; }
.held .orb { display: grid; place-items: center; width: 55.6px; height: 55.6px; margin: 1.2px; border-radius: 50%; background: var(--blue); }
.art:is([data-state="carry"], [data-state="placing"]) .held { opacity: 1; transition: none; }

/* мяч: тот же синий, что у кнопки, — потому что он и есть кнопка */
.ball { position: absolute; z-index: 6; left: 0; top: 0; width: 56px; height: 56px; margin: -28px 0 0 -28px; opacity: 0; pointer-events: none; }
.ball div { width: 100%; height: 100%; }
.ball div div { border-radius: 50%; background: var(--blue); display: grid; place-items: center; }   /* мяч — это коуч со второго экрана: те же глаза */
.cf { position: absolute; left: 0; top: 0; width: 7px; height: 7px; margin: -3.5px; border-radius: 50%; opacity: 0; pointer-events: none; }

/* четвёртая галочка встаёт на место с лёгкой посадкой */
@keyframes land { 0% { opacity: 0; transform: scale(.9); } 55% { opacity: 1; transform: scale(1.07); } 100% { opacity: 1; transform: none; } }
.token-4 { left: 231.69px; top: 199.2px; width: 73px; height: 74px; opacity: 0; transition: opacity 240ms ease; }
.art[data-state="placed"] .token-4 { animation: land 380ms var(--ease-out) both; }
/* соседние галочки отзываются волной от новой */
@keyframes echo { 50% { transform: scale(1.06); } }
.art[data-state="placed"] .token[style*="--w"] { animation: echo 420ms ease-in-out calc(140ms + var(--w) * 70ms); }

@keyframes ripple { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(1.85); } }
.ripple { left: 239.3px; top: 206.95px; width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--blue); opacity: 0; pointer-events: none; }
.art[data-state="placed"] .ripple { animation: ripple 680ms var(--ease-out) 40ms both; }

@keyframes nudge { 50% { transform: scale(1.08); } }
.art[data-state="placed"] .ring-5 { animation: nudge 520ms ease-in-out 380ms; }
@keyframes twinkle { 45% { transform: scale(1.45); } }
.art[data-state="placed"] .dot { animation: twinkle 460ms ease-in-out calc(180ms + var(--i) * 55ms); }

/* ---------- Свечение под текстом, текст, кнопки ---------- */
.aura { position: absolute; z-index: 2; left: 17px; bottom: -128px; width: 615px; height: 600px; pointer-events: none; }
.sheet {
  position: absolute; z-index: 5; inset: auto 0 0 0;
  padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 16px;
}
.copy { display: flex; flex-direction: column; gap: 8px; }
h1 { font-size: 24px; font-weight: 600; line-height: 29px; white-space: nowrap; }
html:not(.sb) h1 { letter-spacing: -.003em; }
html.sb h1 { position: relative; top: -1px; }   /* то же округление метрик, что в статистике */
.copy p { font-size: 16px; line-height: 22px; }
html:not(.sb) .copy p { letter-spacing: .006em; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.btn {
  appearance: none; border: 0; width: 100%; padding: 12px 24px; border-radius: 16px;
  font: 600 16px/24px var(--font); cursor: pointer;
  background: none; color: var(--blue);
  transition: transform 140ms var(--ease-out), background-color 200ms ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn-primary { background: var(--blue); color: #fff; display: grid; }
.btn-primary > span { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 180ms ease, transform 220ms var(--ease-out); }
.btn-primary .done { opacity: 0; transform: translateY(6px); }
.btn-primary.is-done .ask { opacity: 0; transform: translateY(-6px); }
.btn-primary.is-done .done { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) { .btn-primary:hover { background: #2460e6; } }
.home { position: absolute; z-index: 1; left: 50%; bottom: 8px; margin-left: -72px; width: 144px; height: 5px; border-radius: 3px; background: #000; }

/* Репетиция нажатия. Раз в шесть секунд рука опускает галочку на полпути к кружку,
   и кнопка в тот же миг продавливается, будто её нажали. Два предмета двигаются вместе — глаз их связывает. */
.btn-wrap { transform-origin: 50% 50%; }
.btn-primary { position: relative; overflow: hidden; }
.btn-primary::after { content: ""; position: absolute; inset: 0; background: #0b2f8f; opacity: 0; pointer-events: none; }
@keyframes rehearse { 0%, 43%, 66%, 100% { transform: none; } 50%, 53% { transform: scale(.955); } 60% { transform: scale(1.012); } }
@keyframes rehearse-shade { 0%, 43%, 60%, 100% { opacity: 0; } 50%, 53% { opacity: .16; } }
.art[data-state="idle"] ~ .sheet .btn-wrap { animation: rehearse 6s ease-in-out infinite; }
.art[data-state="idle"] ~ .sheet .btn-primary::after { animation: rehearse-shade 6s ease-in-out infinite; }

/* строки текста выезжают из-за своей нижней кромки — со стороны кнопки */
.ln { display: block; overflow: hidden; padding-bottom: 3px; margin-bottom: -3px; }
.ln > span { display: block; }

.replay {
  position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 999px; border: 0;
  font: 600 14px/20px var(--font); color: #3b4354; background: #fff; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 30, 60, .12);
}

.no-anim, .no-anim * { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  .cloud img, .dot img, .hand-float, .ring-4 img, .btn-wrap, .btn-primary::after { animation: none !important; }
  .in, .hand-move, .token-4 { transform: none !important; }
  .art[data-state="placed"] .ripple, .art[data-state="placed"] .ring-5, .art[data-state="placed"] .dot { animation: none; }
}
</style>

<script src="stats.js"></script>
<script>
(() => {
  const art = document.querySelector('.art');
  const connect = document.getElementById('connect');
  const params = new URLSearchParams(location.search);
  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const set = (s) => { art.dataset.state = s; };

  // подгонка телефона под окно; на самом телефоне — без рамки
  const fit = () => {
    const bare = params.has('bare') || Math.min(innerWidth, innerHeight) < 500;
    document.body.classList.toggle('bare', bare);
    document.body.classList.toggle('bare-auto', bare && !params.has('bare'));
    const sh = +params.get('h') || 852;                 // ?h=844 — высота макета, для сверки
    document.documentElement.style.setProperty('--sh', sh + 'px');
    const w = bare ? 393 : 417, h = bare ? sh : sh + 24, pad = bare ? 0 : 32;
    const s = Math.min((innerWidth - pad) / w, (innerHeight - pad) / h, bare ? 9 : 1.15);
    document.documentElement.style.setProperty('--s', s.toFixed(4));
  };
  addEventListener('resize', fit); fit();

  const screen = document.querySelector('.screen');
  const view = (v) => { screen.dataset.view = v; };

  const intro = document.querySelector('.intro');
  const ball = intro.querySelector('.ball'), ballY = ball.firstElementChild, ballS = ballY.firstElementChild;
  const hand = art.querySelector('.hand-move');
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let anims = [];
  const play = (el, frames, opts) => { const a = el.animate(frames, { fill: 'backwards', ...opts }); anims.push(a); return a; };
  const stop = () => { anims.forEach((a) => a.cancel()); anims = []; };
  const tx = (v) => `translateX(${v.toFixed(1)}px)`, ty = (v) => `translateY(${v.toFixed(1)}px)`;
  const UP = 'cubic-bezier(.2, .7, .4, 1)', DOWN = 'cubic-bezier(.55, 0, .9, .5)', OUT = 'cubic-bezier(.23, 1, .32, 1)';
  // центры трёх первых дней и место галочки в руке — в координатах иллюстрации
  const AX = 2, AY = 111.4;                                   // сдвиг иллюстрации на экране
  const DAYS = [[65.52, 265.2], [133.77, 254.28], [201.63, 243.75]], HOLE = [268.3, 235.95], HELD = [239.75, 173.75];
  const scr = ([x, y]) => [AX + x, AY + y];
  const button = () => { const s = +getComputedStyle(document.documentElement).getPropertyValue('--s') || 1, io = intro.getBoundingClientRect(), r = connect.getBoundingClientRect(); return { x: (r.left - io.left) / s, y: (r.top + r.height / 2 - io.top) / s, w: r.width / s }; };
  const COLORS = ['#f17c59', '#49d1c0', '#ffd24a', '#a9dc4c'];

  // конфетти в цветах точек с иллюстрации
  const confetti = (x, y, delay, n = 3, far = 20) => {
    for (let i = 0; i < n; i++) {
      const d = document.createElement('i'); d.className = 'cf'; d.style.background = COLORS[(i + Math.round(x)) % 4]; art.appendChild(d);
      const a = (-150 + (120 / Math.max(1, n - 1)) * i) * Math.PI / 180 + (n > 3 ? i : 0), r = far + (i % 2) * 6;
      const an = play(d, [
        { opacity: 0, transform: `translate(${x}px, ${y}px) scale(.4)` }, { opacity: 1, offset: 0.15 },
        { opacity: 0, transform: `translate(${(x + Math.cos(a) * r).toFixed(1)}px, ${(y + Math.sin(a) * r).toFixed(1)}px) scale(1)` },
      ], { delay, duration: 460, easing: OUT, fill: 'none' });
      an.finished.then(() => d.remove(), () => d.remove());
    }
  };

  // Появление. Синий мяч скачет по трём отмеченным дням: они его держат и пружинят.
  // Четвёртый день пустой — это дыра. Мяч проваливается сквозь кружок, падает вниз и расплющивается в кнопку.
  // Из кнопки строка за строкой выходит текст. Рука появляется последней и замирает над дырой: готова помочь.
  const enter = () => {
    clear(); stop();
    connect.classList.remove('is-done');
    view('intro'); window.Stats.reset();
    art.classList.add('no-anim'); set('pre');
    void art.offsetWidth;
    art.classList.remove('no-anim');
    hand.style.setProperty('--hd', '0ms');
    if (calm) { set('idle'); return; }
    set('enter');

    const P = DAYS.map(scr), H = scr(HOLE), B = button();
    const T0 = 260, L = [T0 + 230, T0 + 440, T0 + 650], PASS = L[2] + 260, HIT = PASS + 270, D = HIT - T0;
    const k = (t) => (t - T0) / D;
    const start = [P[0][0] - 44, P[0][1] - 180];

    play(ball, [{ opacity: 0 }, { opacity: 1, offset: 0.05 }, { opacity: 1, offset: 0.995 }, { opacity: 0 }], { delay: T0, duration: D });
    play(ball, [
      { transform: tx(start[0]) }, { transform: tx(P[0][0]), offset: k(L[0]) }, { transform: tx(P[1][0]), offset: k(L[1]) },
      { transform: tx(P[2][0]), offset: k(L[2]) }, { transform: tx(H[0]), offset: k(PASS) }, { transform: tx(H[0]) },
    ], { delay: T0, duration: D, composite: 'add' });
    const hop = (a, b, t0, t1, h = 32) => [
      { transform: ty(Math.min(a[1], b[1]) - h), offset: k(t0 + (t1 - t0) * 0.46), easing: DOWN },
      { transform: ty(b[1]), offset: k(t1), easing: UP },
    ];
    play(ballY, [
      { transform: ty(start[1]), easing: DOWN }, { transform: ty(P[0][1]), offset: k(L[0]), easing: UP },
      ...hop(P[0], P[1], L[0], L[1]), ...hop(P[1], P[2], L[1], L[2]),
      { transform: ty(Math.min(P[2][1], H[1]) - 40), offset: k(L[2] + 120), easing: DOWN },   // четвёртый прыжок — и мимо: опоры нет
      { transform: ty(H[1]), offset: k(PASS), easing: 'cubic-bezier(.35, .25, .85, .75)' },
      { transform: ty(B.y) },
    ], { delay: T0, duration: D });
    const squash = (t) => [{ transform: 'scale(.94, 1.08)', offset: k(t - 50) }, { transform: 'scale(1.2, .78)', offset: k(t) }, { transform: 'scale(.93, 1.09)', offset: k(t + 80) }];
    play(ballS, [{ transform: 'scale(.94, 1.08)' }, ...squash(L[0]), ...squash(L[1]), ...squash(L[2]), { transform: 'scale(.92, 1.1)', offset: k(PASS) }, { transform: 'scale(.82, 1.16)' }], { delay: T0, duration: D });

    // отмеченные дни держат мяч: каждый пружинит под ним, как батут
    [...art.querySelectorAll('.token.in img')].forEach((img, i) => {
      play(img, [{ transform: 'none' }, { transform: 'translateY(4px) scale(1.08, .88)', offset: 0.22 }, { transform: 'translateY(-2px) scale(.97, 1.05)', offset: 0.55 }, { transform: 'none' }], { delay: L[i] - 30, duration: 380, fill: 'none', easing: 'ease-out' });
      confetti(DAYS[i][0], DAYS[i][1] - 18, L[i] + 10);
    });
    // пустой день не держит: кружок вздрагивает, когда мяч пролетает насквозь
    play(art.querySelector('.ring-4'), [{ transform: 'none' }, { transform: 'scale(1.2)', offset: 0.3 }, { transform: 'scale(.95)', offset: 0.65 }, { transform: 'none' }], { delay: PASS - 40, duration: 420, fill: 'none', easing: 'ease-out' });

    // мяч расплющивается в кнопку — от точки, куда упал
    const inL = Math.max(0, H[0] - B.x - 24), inR = Math.max(0, B.x + B.w - H[0] - 24);
    play(connect, [{ opacity: 0 }, { opacity: 0, offset: 0.999 }, { opacity: 1 }], { duration: HIT, fill: 'none' });
    play(connect, [{ clipPath: `inset(0 ${inR.toFixed(1)}px 0 ${inL.toFixed(1)}px round 24px)` }, { clipPath: 'inset(0 0px 0 0px round 16px)' }], { delay: HIT, duration: 380, easing: OUT });
    play(connect.parentElement, [{ transform: 'scale(1.04, .7)' }, { transform: 'scale(.985, 1.1)', offset: 0.42 }, { transform: 'scale(1.005, .98)', offset: 0.72 }, { transform: 'none' }], { delay: HIT, duration: 460, fill: 'none', easing: 'ease-out' });
    play(connect.querySelector('.ask'), [{ opacity: 0 }, { opacity: 1 }], { delay: HIT + 170, duration: 200 });
    play(intro.querySelector('.aura'), [{ opacity: 0 }, { opacity: 1 }], { delay: 150, duration: 700 });
    // текст выходит из кнопки: сначала ближняя к ней строка, заголовок последним
    [...intro.querySelectorAll('.copy .ln > span')].reverse().forEach((el, i) => play(el, [{ transform: 'translateY(108%)' }, { transform: 'none' }], { delay: HIT + 100 + i * 55, duration: 460, easing: OUT }));
    play(document.getElementById('later'), [{ opacity: 0, transform: 'translateY(-12px)' }, { opacity: 1, transform: 'none' }], { delay: HIT + 230, duration: 380, easing: OUT });

    // рука приходит, когда мяч уже упал, и замирает над пустым кружком
    play(hand, [{ opacity: 0 }, { opacity: 1 }], { delay: PASS + 120, duration: 200 });
    play(hand, [{ transform: 'translate(-66px, -74px)' }, { transform: 'none' }], { delay: PASS + 120, duration: 620, easing: OUT });

    later(() => set('idle'), HIT + 140);
  };
  // нажатие во время появления пропускает его
  intro.addEventListener('pointerdown', () => { if (art.dataset.state !== 'enter') return; anims.forEach((a) => { try { a.finish(); } catch (e) { /* бесконечных тут нет */ } }); clear(); set('idle'); });

  const rearm = (wait) => {              // рука уходит тем же путём, каким пришла, и возвращается
    set('rearm');
    connect.classList.remove('is-done');
    hand.style.setProperty('--hd', '0ms');
    later(() => set('idle'), wait);
  };

  // «Подключить»: кнопка отдаёт мяч, рука ловит его и ставит в пустой кружок. Дыры больше нет — курс сохранён.
  const place = () => {
    if (art.dataset.state !== 'idle') return;
    clear();
    connect.classList.add('is-done');
    if (calm) { set('placed'); if (!params.has('stay')) later(() => view('stats'), 800); return; }
    set('toss');
    const B = button(), from = [B.x + B.w / 2, B.y], to = scr(HELD), FLY = 340;
    play(connect.parentElement, [{ transform: 'none' }, { transform: 'scale(1.03, .82)', offset: 0.3 }, { transform: 'scale(.99, 1.06)', offset: 0.65 }, { transform: 'none' }], { duration: 360, fill: 'none', easing: 'ease-out' });
    play(ball, [{ opacity: 1 }, { opacity: 1, offset: 0.985 }, { opacity: 0 }], { duration: FLY, fill: 'none' });
    play(ball, [{ transform: tx(from[0]) }, { transform: tx(to[0]) }], { duration: FLY, composite: 'add', easing: 'cubic-bezier(.3, .5, .5, 1)', fill: 'none' });
    play(ballY, [{ transform: ty(from[1]), easing: OUT }, { transform: ty(to[1]) }], { duration: FLY, fill: 'none' });
    play(ballS, [{ transform: 'scale(.8, 1.2)' }, { transform: 'scale(1)' }], { duration: FLY, fill: 'none', easing: OUT });
    later(() => {                                   // поймала: от рывка рука чуть проседает вверх по ходу мяча
      set('carry');
      play(hand, [{ transform: 'translate(-3px, -7px)' }, { transform: 'none' }], { duration: 170, easing: 'ease-out', fill: 'none' });
    }, FLY - 12);
    later(() => set('placing'), FLY + 130);
    later(() => { set('placed'); confetti(268.3, 228, 60, 6, 34); }, FLY + 130 + 270);
    if (!params.has('stay')) later(() => view('stats'), FLY + 130 + 270 + 800);
  };

  connect.addEventListener('click', place);
  // «Позже»: рука уходит, экран закрывается
  document.getElementById('later').addEventListener('click', () => {
    if (art.dataset.state !== 'idle') return;
    clear(); set('rearm');
    if (params.has('stay')) { later(() => set('idle'), 1300); return; }
    if (!calm) {   // выход зеркалит вход: строки уходят обратно за кромку, кнопка сжимается
      [...intro.querySelectorAll('.copy .ln > span')].forEach((el, i) => play(el, [{ transform: 'none' }, { transform: 'translateY(108%)' }], { delay: i * 30, duration: 260, easing: 'ease-in', fill: 'forwards' }));
      play(connect.parentElement, [{ transform: 'none', opacity: 1 }, { transform: 'scale(.9)', opacity: 0 }], { delay: 120, duration: 240, easing: 'ease-in', fill: 'forwards' });
    }
    later(() => view('stats'), 420);
  });
  document.getElementById('replay').addEventListener('click', enter);

  const imgs = [...document.querySelectorAll('.art img, .aura')].map((i) => i.decode ? i.decode().catch(() => {}) : 0);
  Promise.all(imgs).then(() => { if (params.get('screen') === 'stats') { art.classList.add('no-anim'); set('idle'); view('stats'); } else if (!params.has('hold')) enter(); else { art.classList.add('no-anim'); set('idle'); if (params.get('screen') === 'stats') view('stats'); } });
})();
</script>
</body>
</html>
