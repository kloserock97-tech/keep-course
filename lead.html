<style>
/* Шрифт макета подключён по ссылке владельца, файлов в проекте нет. Если не загрузился — Manrope. */
@font-face { font-family: "SB Sans Display"; font-weight: 400; font-display: swap; src: url(https://cdn-app.sberdevices.ru/shared-static/0.0.0/fonts/SBSansDisplay.0.2.0/SBSansDisplay-Regular.woff2) format("woff2"); }
@font-face { font-family: "SB Sans Display"; font-weight: 600; font-display: swap; src: url(https://cdn-app.sberdevices.ru/shared-static/0.0.0/fonts/SBSansDisplay.0.2.0/SBSansDisplay-Semibold.woff2) format("woff2"); }
/* Manrope лежит рядом. Глифы приподняты на 0,06 em: так строки встают на те же места, что в макете */
@font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(assets/fonts/manrope-cyrillic.woff2) format("woff2"); unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116; ascent-override: 100.6%; descent-override: 36%; line-gap-override: 0%; }
@font-face { font-family: Manrope; font-weight: 400 700; font-display: swap; src: url(assets/fonts/manrope-latin.woff2) format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2212; ascent-override: 100.6%; descent-override: 36%; line-gap-override: 0%; }
:root {
  --blue: #2b6cfc;
  --ink: #020202;
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
  --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
  --page: #e9edf3;
  --font: "SB Sans Display", Manrope, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--page);
  font-family: var(--font); font-weight: 400;
  color: var(--ink);
  display: grid;
  place-items: center;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ---------- iPhone 15 ---------- */
.fit { width: calc(417px * var(--s, 1)); height: calc((var(--sh, 852px) + 24px) * var(--s, 1)); }
.device {
  width: 417px; height: calc(var(--sh, 852px) + 24px); padding: 12px;
  border-radius: 67px;
  background: #101114;
  box-shadow: 0 0 0 2px #c9ccd3, 0 0 0 3px #8e9199, 0 40px 80px -30px rgba(20, 30, 60, .35);
  transform: scale(var(--s, 1)); transform-origin: 0 0;
}
.screen {
  position: relative; width: 393px; height: var(--sh, 852px);
  border-radius: 55px; overflow: hidden; background: #fff;
  isolation: isolate;
}
.island {
  position: absolute; z-index: 40; top: 11px; left: 50%; margin-left: -63px;
  width: 126px; height: 37px; border-radius: 20px; background: #000;
}
body.bare .fit { width: calc(393px * var(--s, 1)); height: calc(var(--sh, 852px) * var(--s, 1)); }
body.bare .device { width: 393px; height: var(--sh, 852px); padding: 0; border-radius: 0; box-shadow: none; background: none; }
body.bare .screen { border-radius: 0; }
body.bare .island, body.bare:not(.bare-auto) .replay { display: none; }
body.bare-auto .replay { top: 12px; right: auto; bottom: auto; left: 50%; transform: translateX(-50%); z-index: 50; padding: 6px 12px; font-size: 12px; opacity: .7; }
body.bare { background: #fff; }

/* ---------- Статус-бар и шапка ---------- */
.header {
  position: absolute; z-index: 4; inset: 0 0 auto 0; height: 104px;
  background: linear-gradient(#fff 80%, rgba(255, 255, 255, 0));
}
.time {
  position: absolute; left: 0; top: 18.34px; width: 140.5px; text-align: center;
  font: 590 17px/22px -apple-system, "SF Pro Text", "SF Pro", Inter, "Segoe UI", sans-serif;
  color: #222; letter-spacing: 0;
}
.levels { position: absolute; right: 0; top: 0; width: 140.5px; height: 54px; }
.levels > * { position: absolute; display: block; }
.cellular { left: 30px; top: 23.54px; }
.wifi { left: 56.7px; top: 23.64px; }
.batt { left: 81px; top: 23px; width: 25px; height: 13px; border-radius: 4.3px; background: rgba(34, 34, 34, .35); }
.batt::after { content: ""; position: absolute; inset: 2px; border-radius: 2.5px; background: #222; }
.cap { left: 107px; top: 27.78px; }

/* ---------- Иллюстрация ---------- */
.art { position: absolute; z-index: 1; left: 2px; top: 111.4px; width: 390px; height: 380.75px; }
.l { position: absolute; }
.l img { display: block; width: 100%; height: 100%; }

/* фон иллюстрации только проявляется: это декорация, двигаться ей незачем */
.in { opacity: 0; transition: opacity 360ms ease var(--d, 0ms); }
.art:not([data-state="pre"]) .in { opacity: 1; }

/* фоновый цикл: облака плывут, точки покачиваются */
@keyframes drift { from { transform: translateX(calc(var(--a, 6px) * -1)); } to { transform: translateX(var(--a, 6px)); } }
@keyframes bob { from { transform: translateY(-2.5px); } to { transform: translateY(2.5px); } }
.cloud img { animation: drift var(--t, 11s) ease-in-out var(--o, 0s) infinite alternate; }
.dot img { animation: bob var(--t, 4.6s) ease-in-out var(--o, 0s) infinite alternate; }

.token::before { /* белая подложка: галочка в картинке прозрачная */
  content: ""; position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px; border-radius: 50%; background: #fff;
}
.token img { position: relative; }

/* Рука с галочкой. Ею управляет кнопка: каждое состояние — просто положение руки,
   а переходы между ними можно прервать в любой момент. */
.hand-move {
  position: absolute; inset: 0;
  opacity: 0; transform: translate(-200px, 40px);
  transition: transform 260ms var(--ease-out), opacity 200ms ease;
}
.art:is([data-state="enter"], [data-state="idle"], [data-state="lean"], [data-state="down"], [data-state="placing"]) .hand-move { opacity: 1; }
.art[data-state="enter"] .hand-move { transform: none; transition: none; }                                   /* вход ведёт сценарий */
.art[data-state="idle"] .hand-move { transform: none; }
.art[data-state="idle"].hint .hand-move { transform: translate(5px, 11px); transition-duration: 420ms; }       /* редкий намёк: рука примеряется */
.art[data-state="lean"] .hand-move { transform: translate(4px, 9px); transition-duration: 200ms; }             /* курсор над кнопкой */
.art[data-state="down"] .hand-move { transform: translate(16px, 35px); transition-duration: 130ms; }           /* палец на кнопке: рука уже опускает галочку */
.art[data-state="placing"] .hand-move { transform: translate(28.57px, 62.2px); transition-duration: 140ms; }   /* отпустили: галочка встаёт */
.art[data-state="placed"] .hand-move { opacity: 0; transform: translate(-56px, -64px); transition: transform 520ms var(--ease-in-out) 120ms, opacity 240ms ease 340ms; }
.art[data-state="rearm"] .hand-move { opacity: 0; transform: translate(-200px, 40px); transition: transform 320ms var(--ease-in-out), opacity 200ms ease 120ms; }

/* покой: рука едва покачивается; пока её ведёт кнопка — замирает */
@keyframes float { from { transform: translateY(-2px) rotate(-.7deg); } to { transform: translateY(2px) rotate(.7deg); } }
.hand-float { position: absolute; inset: 0; transform-origin: 80px 40px; animation: float 5s ease-in-out infinite alternate; }
.art:is([data-state="lean"], [data-state="down"], [data-state="placing"], [data-state="placed"]) .hand-float { animation-play-state: paused; }
.ring-4 { left: 229px; top: 197px; width: 78px; height: 78px; }
.ring-4 img { position: absolute; left: 0; top: 0; transition: opacity 420ms ease; }
.ring-4 .clean { left: 5px; top: 5px; width: 68px; height: 68px; opacity: 0; }
.art[data-state="placed"] .ring-4 .clean, .art[data-state="rearm"] .ring-4 .clean { opacity: 1; }
.art[data-state="placed"] .ring-4 .lit, .art[data-state="rearm"] .ring-4 .lit { opacity: 0; }
.ring-4 { transition: transform 200ms var(--ease-out), opacity 360ms ease; }
.art[data-state="idle"].hint .ring-4 { transform: scale(1.04); transition-duration: 420ms; }
.art[data-state="lean"] .ring-4 { transform: scale(1.03); }
.art[data-state="down"] .ring-4 { transform: scale(1.08); transition-duration: 130ms; }
/* пустые кружки первых трёх дней: видны только на входе, до галочек */
.ghost { opacity: 0; }
/* кнопка «вздыхает» вместе с намёком руки — чуть приподнимается, а не продавливается */
.btn-wrap { transition: transform 420ms var(--ease-out); }
.art[data-state="idle"].hint ~ .sheet .btn-wrap { transform: scale(1.018); }
/* нажатие: кнопка и рука двигаются одним движением, поэтому масштаб кнопки привязан к тому же состоянию */
.art[data-state="down"] ~ .sheet .btn-wrap { transform: scale(.97); transition-duration: 130ms; }
.btn-primary:active { transform: none; }

.hand { left: 46px; top: 11px; width: 229px; height: 175px; }
.held { transition: opacity 110ms ease; }
.art[data-state="placed"] .held { opacity: 0; }

.glow-wrap { transition: opacity 180ms ease, transform 180ms var(--ease-out); }
@keyframes breathe { from { opacity: .88; transform: scale(.99); } to { opacity: 1; transform: scale(1.02); } }
.glow { animation: breathe 2.4s ease-in-out infinite alternate; }
.art[data-state="placed"] .glow-wrap { opacity: 0; transform: scale(1.3); }

/* четвёртая галочка встаёт на место с лёгкой посадкой */
@keyframes land { 0% { opacity: 0; transform: scale(.9); } 55% { opacity: 1; transform: scale(1.07); } 100% { opacity: 1; transform: none; } }
.token-4 { left: 231.69px; top: 199.2px; width: 73px; height: 74px; opacity: 0; transition: opacity 240ms ease; }
.art[data-state="placed"] .token-4 { animation: land 380ms var(--ease-out) both; }
/* соседние галочки отзываются волной от новой */
@keyframes echo { 50% { transform: scale(1.06); } }
.art[data-state="placed"] .token[style*="--w"] { animation: echo 420ms ease-in-out calc(140ms + var(--w) * 70ms); }

@keyframes ripple { from { opacity: .5; transform: scale(1); } to { opacity: 0; transform: scale(1.85); } }
.ripple { left: 239.3px; top: 206.95px; width: 58px; height: 58px; border-radius: 50%; border: 2px solid var(--blue); opacity: 0; pointer-events: none; }
.art[data-state="placed"] .ripple { animation: ripple 680ms var(--ease-out) 40ms both; }

@keyframes nudge { 50% { transform: scale(1.08); } }
.art[data-state="placed"] .ring-5 { animation: nudge 520ms ease-in-out 380ms; }
@keyframes twinkle { 45% { transform: scale(1.45); } }
.art[data-state="placed"] .dot { animation: twinkle 460ms ease-in-out calc(180ms + var(--i) * 55ms); }

/* ---------- Свечение под текстом, текст, кнопки ---------- */
.aura { position: absolute; z-index: 2; left: 17px; bottom: -128px; width: 615px; height: 600px; pointer-events: none; }
.sheet {
  position: absolute; z-index: 5; inset: auto 0 0 0;
  padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 16px;
}
.copy { display: flex; flex-direction: column; gap: 8px; }
h1 { font-size: 24px; font-weight: 600; line-height: 29px; white-space: nowrap; }
html:not(.sb) h1 { letter-spacing: -.003em; }
html.sb h1 { position: relative; top: -1px; }   /* то же округление метрик, что в статистике */
.copy p { font-size: 16px; line-height: 22px; }
html:not(.sb) .copy p { letter-spacing: .006em; }
.actions { display: flex; flex-direction: column; gap: 8px; }
.btn {
  appearance: none; border: 0; width: 100%; padding: 12px 24px; border-radius: 16px;
  font: 600 16px/24px var(--font); cursor: pointer;
  background: none; color: var(--blue);
  transition: transform 140ms var(--ease-out), background-color 200ms ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.btn:active { transform: scale(.97); }
.btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.btn-primary { background: var(--blue); color: #fff; display: grid; }
.btn-primary > span { grid-area: 1 / 1; display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity 180ms ease, transform 220ms var(--ease-out); }
.btn-primary .done { opacity: 0; transform: translateY(6px); }
.btn-primary.is-done .ask { opacity: 0; transform: translateY(-6px); }
.btn-primary.is-done .done { opacity: 1; transform: none; }
@media (hover: hover) and (pointer: fine) { .btn-primary:hover { background: #2460e6; } }
.home { position: absolute; z-index: 1; left: 50%; bottom: 8px; margin-left: -72px; width: 144px; height: 5px; border-radius: 3px; background: #000; }

.replay {
  position: fixed; right: 20px; bottom: 20px; padding: 10px 16px; border-radius: 999px; border: 0;
  font: 600 14px/20px var(--font); color: #3b4354; background: #fff; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 30, 60, .12);
}

.no-anim, .no-anim * { transition: none !important; }

@media (prefers-reduced-motion: reduce) {
  .cloud img, .dot img, .hand-float, .glow { animation: none !important; }
  .in, .hand-move, .token-4, .ring-4, .btn-wrap { transform: none !important; }
  .art[data-state="placed"] .ripple, .art[data-state="placed"] .ring-5, .art[data-state="placed"] .dot { animation: none; }
}
</style>

<script>
(() => {
  const art = document.querySelector('.art');
  const connect = document.getElementById('connect');
  const params = new URLSearchParams(location.search);
  let timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  const clear = () => { timers.forEach(clearTimeout); timers = []; };
  const set = (s) => { art.dataset.state = s; };

  // подгонка телефона под окно; на самом телефоне — без рамки
  const fit = () => {
    const bare = params.has('bare') || Math.min(innerWidth, innerHeight) < 500;
    document.body.classList.toggle('bare', bare);
    document.body.classList.toggle('bare-auto', bare && !params.has('bare'));
    const sh = +params.get('h') || 852;                 // ?h=844 — высота макета, для сверки
    document.documentElement.style.setProperty('--sh', sh + 'px');
    const w = bare ? 393 : 417, h = bare ? sh : sh + 24, pad = bare ? 0 : 32;
    const s = Math.min((innerWidth - pad) / w, (innerHeight - pad) / h, bare ? 9 : 1.15);
    document.documentElement.style.setProperty('--s', s.toFixed(4));
  };
  addEventListener('resize', fit); fit();

  const screen = document.querySelector('.screen');
  const view = (v) => { screen.dataset.view = v; };

  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const hand = art.querySelector('.hand-move');
  const OUT = 'cubic-bezier(.23, 1, .32, 1)';
  let anims = [], hintTimer = 0;
  const play = (el, frames, opts) => { const a = el.animate(frames, { fill: 'backwards', ...opts }); anims.push(a); return a; };
  const settle = () => { anims.forEach((a) => { try { a.finish(); } catch (e) { /* уже завершена */ } }); anims = []; };
  const stop = () => { anims.forEach((a) => a.cancel()); anims = []; };

  // Редкий намёк: рука чуть опускает галочку к пустому кружку, кнопка «вздыхает» вместе с ней.
  // Первый раз — через 2,6 с покоя, дальше раз в 7 с. Любое касание кнопки намёк отменяет.
  const hintOff = () => { clearTimeout(hintTimer); art.classList.remove('hint'); };
  const hintOn = (wait = 2600) => {
    hintOff();
    if (calm) return;
    hintTimer = setTimeout(() => {
      if (art.dataset.state !== 'idle') return;
      art.classList.add('hint');
      hintTimer = setTimeout(() => { art.classList.remove('hint'); hintOn(7000); }, 520);
    }, wait);
  };

  // Вход — один жест, 680 мс, и он ничего не загораживает: текст и кнопки стоят с первого кадра.
  // Рука проходит слева над тремя днями, и каждый отмечается в тот миг, когда галочка оказывается над ним.
  const enter = () => {
    clear(); stop(); hintOff();
    connect.classList.remove('is-done');
    view('intro'); window.Stats.reset();
    art.classList.add('no-anim'); set('pre');
    void art.offsetWidth;
    art.classList.remove('no-anim');
    if (calm) { set('idle'); return; }
    set('enter');
    const D = 680, at = [0.08, 0.26, 0.46];                    // доли пути, когда галочка в руке проходит над 1-м, 2-м и 3-м днём
    play(hand, [
      { transform: 'translate(-200px, 40px)', opacity: 0 }, { transform: 'translate(-174px, 38px)', opacity: 1, offset: at[0] },
      { transform: 'translate(-106px, 33px)', offset: at[1] }, { transform: 'translate(-38px, 21px)', offset: at[2] },
      { transform: 'translate(3px, -3px)', offset: 0.84, easing: 'ease-in-out' }, { transform: 'translate(0, 0)' },
    ], { duration: D });
    [...art.querySelectorAll('.token:not(.token-4)')].forEach((t, i) => {
      const tick = Math.round(D * at[i]) + 20;
      play(t, [{ opacity: 0, transform: 'scale(.86)' }, { opacity: 1, transform: 'scale(1.06)', offset: 0.5 }, { opacity: 1, transform: 'none' }], { delay: tick, duration: 240, easing: OUT });
      play(art.querySelectorAll('.ghost')[i], [{ opacity: 1 }, { opacity: 1, offset: tick / (tick + 120) }, { opacity: 0 }], { duration: tick + 120, fill: 'none' });
    });
    play(art.querySelector('.ring-4 .lit'), [{ opacity: 0 }, { opacity: 0, offset: 0.7 }, { opacity: 1 }], { duration: D });
    play(art.querySelector('.ring-4 .clean'), [{ opacity: 1 }, { opacity: 1, offset: 0.7 }, { opacity: 0 }], { duration: D });
    later(() => { if (art.dataset.state === 'enter') { set('idle'); hintOn(); } }, D);
  };

  const rearm = (wait) => { hintOff(); set('rearm'); connect.classList.remove('is-done'); later(() => { set('idle'); hintOn(); }, wait); };

  // Кнопка ведёт руку. Палец лёг на кнопку — рука уже опускает галочку; отпустили — галочка встаёт;
  // увели палец в сторону — рука возвращается. Отклик начинается в том же кадре, что и касание.
  const ready = () => ['idle', 'lean', 'enter'].includes(art.dataset.state);
  const press = () => { if (!ready()) return false; settle(); clear(); hintOff(); set('down'); return true; };
  const release = () => { if (art.dataset.state === 'down') { set('idle'); hintOn(4000); } };
  const place = () => {
    if (!['down', 'idle', 'lean', 'enter'].includes(art.dataset.state)) return;
    settle(); clear(); hintOff();
    connect.classList.add('is-done');
    set('placing');
    later(() => set('placed'), calm ? 0 : 130);
    if (!params.has('stay')) later(() => view('stats'), 1000);
  };

  let held = false;
  connect.addEventListener('pointerdown', (e) => { if (e.button) return; held = press(); if (held) { try { connect.setPointerCapture(e.pointerId); } catch (err) { /* указатель не настоящий */ } } });
  connect.addEventListener('pointerup', (e) => {
    if (!held) return; held = false;
    const r = connect.getBoundingClientRect(), inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (inside) place(); else release();
  });
  connect.addEventListener('pointercancel', () => { held = false; release(); });
  connect.addEventListener('pointermove', (e) => {          // палец съехал с кнопки — рука отступает, вернулся — снова опускает
    if (!held) return;
    const r = connect.getBoundingClientRect(), inside = e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
    if (!inside && art.dataset.state === 'down') set('idle'); else if (inside && art.dataset.state === 'idle') set('down');
  });
  connect.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse' && art.dataset.state === 'idle') { hintOff(); set('lean'); } });
  connect.addEventListener('pointerleave', () => { if (art.dataset.state === 'lean') { set('idle'); hintOn(4000); } });
  connect.addEventListener('keydown', (e) => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) press(); });
  connect.addEventListener('keyup', (e) => { if (e.key === ' ' || e.key === 'Enter') place(); });
  connect.addEventListener('click', (e) => { if (e.detail === 0) place(); });      // нажатие без указателя и клавиш: вспомогательные технологии

  // «Позже»: рука уходит тем же путём, каким пришла, экран закрывается
  document.getElementById('later').addEventListener('click', () => {
    if (!ready()) return;
    settle(); clear(); hintOff(); set('rearm');
    if (params.has('stay')) later(() => { set('idle'); hintOn(); }, 1300); else later(() => view('stats'), 380);
  });
  document.getElementById('replay').addEventListener('click', enter);

  const imgs = [...document.querySelectorAll('.art img')].map((i) => i.decode ? i.decode().catch(() => {}) : 0);
  Promise.all(imgs).then(() => { if (params.get('screen') === 'stats') { art.classList.add('no-anim'); set('idle'); view('stats'); } else if (!params.has('hold')) enter(); else { art.classList.add('no-anim'); set('idle'); if (params.get('screen') === 'stats') view('stats'); } });
  window.__place = place;
})();
</script>
</body>
</html>
